# PrusaSlicer 2.7 profile - Elegoo Neptune 3 Pro running Klipper, 0.4 mm nozzle, PETG
# Tuned for tiny precision parts (TC2030 pin holder). Re-slice: prusa-slicer --load this.ini ...
# ---------- printer ----------
printer_model =
gcode_flavor = klipper
bed_shape = 0x0,225x0,225x225,0x225
max_print_height = 280
nozzle_diameter = 0.4
printer_variant = 0.4
use_relative_e_distances = 1
use_firmware_retraction = 0
retract_length = 0.8
retract_speed = 40
deretract_speed = 30
retract_lift = 0.2
retract_before_travel = 1
retract_layer_change = 1
wipe = 0
machine_max_acceleration_extruding = 3000
machine_max_acceleration_travel = 3000
machine_limits_usage = ignore
gcode_label_objects = firmware
gcode_comments = 0
thumbnails =
start_gcode = ; ===== Neptune 3 Pro / Klipper start =====\n; Uses only standard commands. If your printer.cfg has a PRINT_START macro,\n; you can replace this block with: PRINT_START BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature]\nM140 S[first_layer_bed_temperature] ; bed heat (no wait)\nM104 S150 ; nozzle warm, below ooze temp, for probing\nG90\nM83\nG28 ; home all\nM190 S[first_layer_bed_temperature] ; wait bed\nBED_MESH_CALIBRATE ; Neptune 3 Pro has an inductive probe; comment out and use BED_MESH_PROFILE LOAD=default if you keep a saved mesh\nM109 S[first_layer_temperature] ; wait nozzle\nG1 Z5 F3000\nG1 X5 Y20 F6000\nG1 Z0.28 F600\nG1 X5 Y180 E15 F1200 ; purge line 1\nG1 X5.5 Y180 F3000\nG1 X5.5 Y20 E12 F1200 ; purge line 2\nG1 Z1.0 F600\nG92 E0
end_gcode = ; ===== end =====\nG91\nG1 E-1.5 F2400\nG1 Z10 F600\nG90\nG1 X10 Y215 F6000 ; present the bed\nM104 S0\nM140 S0\nM106 S0\nM84\n; If you have an END_PRINT macro you can use it instead of this block
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0
layer_gcode = ;AFTER_LAYER_CHANGE
# ---------- filament (PETG) ----------
filament_type = PETG
filament_diameter = 1.75
extrusion_multiplier = 0.97
temperature = 235
first_layer_temperature = 240
bed_temperature = 75
first_layer_bed_temperature = 80
cooling = 1
fan_always_on = 1
min_fan_speed = 40
max_fan_speed = 70
bridge_fan_speed = 90
disable_fan_first_layers = 2
fan_below_layer_time = 30
slowdown_below_layer_time = 15
min_print_speed = 8
filament_max_volumetric_speed = 8
# ---------- print ----------
layer_height = 0.12
first_layer_height = 0.2
perimeter_generator = arachne
wall_add_middle_threshold = 50%
min_feature_size = 15%
min_bead_width = 60%
perimeters = 3
top_solid_layers = 6
bottom_solid_layers = 5
fill_density = 100%
fill_pattern = rectilinear
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
infill_first = 0
external_perimeters_first = 0
seam_position = rear
slice_closing_radius = 0.02
resolution = 0.005
gcode_resolution = 0.005
xy_size_compensation = 0
elefant_foot_compensation = 0.15
support_material = 0
brim_type = outer_only
brim_width = 3
brim_separation = 0.1
skirts = 1
skirt_distance = 4
skirt_height = 1
extrusion_width = 0.42
first_layer_extrusion_width = 0.45
perimeter_extrusion_width = 0.42
external_perimeter_extrusion_width = 0.42
infill_extrusion_width = 0.42
solid_infill_extrusion_width = 0.42
top_infill_extrusion_width = 0.40
first_layer_speed = 15
perimeter_speed = 30
external_perimeter_speed = 20
small_perimeter_speed = 12
infill_speed = 40
solid_infill_speed = 35
top_solid_infill_speed = 25
gap_fill_speed = 20
travel_speed = 150
default_acceleration = 1500
perimeter_acceleration = 1000
first_layer_acceleration = 500
travel_acceleration = 3000
avoid_crossing_perimeters = 1
only_retract_when_crossing_perimeters = 0
complete_objects = 0
min_skirt_length = 4
duplicate_distance = 8
